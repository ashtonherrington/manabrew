import net.ltgt.gradle.errorprone.CheckSeverity

plugins {
    id 'java'
    id 'jacoco'
    id 'checkstyle'
    id 'pmd'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.10.3'
    id 'net.ltgt.errorprone' version '5.1.1'
    id 'com.github.spotbugs' version '6.5.12'
    id 'org.sonarqube' version '7.5.0.8588'
}

group = 'com.manabrew'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

// Security overrides of versions managed by Spring Boot, found by the Trivy image
// scan. Remove each line once a Spring Boot release ships the fixed version.
ext['tomcat.version'] = '11.0.25'      // Boot 4.1.1 has 11.0.24: 3 CRITICAL CVEs
ext['jackson-bom.version'] = '3.1.7'   // Boot 4.1.1 has 3.1.5: 5 HIGH CVEs

dependencyManagement {
    imports {
        mavenBom 'org.springframework.modulith:spring-modulith-bom:2.1.1'
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-jooq'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.modulith:spring-modulith-starter-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.jspecify:jspecify:1.0.1'
    runtimeOnly 'org.postgresql:postgresql'

    errorprone 'com.google.errorprone:error_prone_core:2.50.0'
    errorprone 'com.uber.nullaway:nullaway:0.14.2'

    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-jooq-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy 'jacocoTestReport'
}

// ---- Formatting: google-java-format via Spotless ----

spotless {
    java {
        // 1.37.0 fails under Spotless 8.10.3; 1.36.1 is the version Spotless bundles.
        googleJavaFormat('1.36.1')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

// ---- Compile-time bug checks: Error Prone + NullAway ----

tasks.withType(JavaCompile).configureEach {
    options.errorprone {
        disableWarningsInGeneratedCode = true
        excludedPaths = '.*/build/generated/.*'
        // Null-safety for all of com.manabrew and its sub-packages. (@NullMarked on a
        // package does not cover sub-packages, so it is not used as the switch.)
        check('NullAway', name.toLowerCase().contains('test') ? CheckSeverity.OFF : CheckSeverity.ERROR)
        option('NullAway:AnnotatedPackages', 'com.manabrew')
    }
}

// ---- Linters: Checkstyle (Google rules), PMD, SpotBugs ----

checkstyle {
    toolVersion = '14.3.0'
    // Google's config, bundled in the Checkstyle jar. Formatting checks are
    // suppressed because google-java-format owns formatting.
    config = resources.text.fromArchiveEntry(
            configurations.checkstyle.filter { it.name.startsWith('checkstyle-') },
            'google_checks.xml')
    configProperties = [
            'org.checkstyle.google.severity'                  : 'error',
            'org.checkstyle.google.suppressionfilter.config'  : file('config/checkstyle/suppressions.xml').path,
            'org.checkstyle.google.suppressionxpathfilter.config': file('config/checkstyle/suppressions-xpath.xml').path,
    ]
    maxWarnings = 0
}

pmd {
    toolVersion = '7.28.0'
    consoleOutput = true
    ruleSets = []
    ruleSetFiles = files('config/pmd/ruleset.xml')
}

spotbugs {
    toolVersion = '4.10.4'
    effort = 'MAX'
    reportLevel = 'MEDIUM'
    excludeFilter = file('config/spotbugs/exclude.xml')
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    reports {
        html { required = true }
    }
}

// Linters check production code only; tests follow looser conventions.
['checkstyleTest', 'pmdTest', 'spotbugsTest'].each { tasks.named(it) { enabled = false } }

// ---- Coverage + SonarQube Cloud ----

jacocoTestReport {
    reports {
        xml.required = true
    }
}

sonar {
    properties {
        property 'sonar.projectKey', 'ashtonherrington_manabrew'
        property 'sonar.organization', 'ashtonherrington'
        property 'sonar.host.url', 'https://sonarcloud.io'
    }
}

// `./gradlew build` runs every check above plus tests; fix formatting with
// `./gradlew spotlessApply`.
tasks.named('check') {
    dependsOn 'spotlessCheck'
}
