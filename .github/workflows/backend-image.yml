name: backend-image

# Builds and publishes the backend image on merge to main.
# DISABLED until the repository variable IMAGE_PUBLISH_ENABLED is set to "true"
# (Settings → Secrets and variables → Actions → Variables). Manual runs from the
# Actions tab also require it.
on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-image.yml"]
  workflow_dispatch:

jobs:
  test:
    if: vars.IMAGE_PUBLISH_ENABLED == 'true'
    uses: ./.github/workflows/backend-test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/manabrew-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/manabrew-backend:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
