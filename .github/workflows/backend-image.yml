name: backend-image

# Builds the backend image and scans it for known vulnerabilities (Trivy).
#
# - Pull requests: build + scan only. Nothing is published. Catches vulnerable
#   dependencies or base-image packages before merge.
# - Merge to main: build + scan, then publish to GHCR only if the scan passes.
#   Publishing is DISABLED until the repository variable IMAGE_PUBLISH_ENABLED is
#   "true" (Settings → Secrets and variables → Actions → Variables).
on:
  pull_request:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-image.yml", ".trivyignore"]
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-image.yml", ".trivyignore"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/manabrew-backend
  TRIVY_VERSION: "0.75.0"

jobs:
  build-scan-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3

      - name: Build image (local only)
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scans OS packages in the base image AND the Java dependencies inside the
      # Spring Boot jar. Fails on HIGH or CRITICAL issues that have a fix
      # available. Accepted exceptions go in .trivyignore with a reason.
      - name: Scan image for vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore:/.trivyignore:ro" \
            aquasec/trivy:${TRIVY_VERSION} image \
              --exit-code 1 \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --ignorefile /.trivyignore \
              "${IMAGE}:${GITHUB_SHA}"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && vars.IMAGE_PUBLISH_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish scanned image
        if: github.event_name != 'pull_request' && vars.IMAGE_PUBLISH_ENABLED == 'true'
        run: |
          docker tag "${IMAGE}:${GITHUB_SHA}" "${IMAGE}:main"
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:main"
