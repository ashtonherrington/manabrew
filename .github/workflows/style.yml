name: style

# Every push to any branch, which includes merges into main.
on:
  push:
    paths: ["backend/**/*.java", "backend/build.gradle", ".github/workflows/style.yml"]

jobs:
  google-java-format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Check formatting against google-java-format
        run: ./gradlew spotlessCheck
